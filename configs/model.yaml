# ---------------------------------------------------------------
# SentinelML — model configuration
# ---------------------------------------------------------------
task: classification
algorithm: logistic_regression   # logistic_regression | random_forest | hist_gradient_boosting
random_state: 42

params:
  logistic_regression: {C: 1.0, max_iter: 500}
  random_forest: {n_estimators: 200, max_depth: 10, n_jobs: -1}
  hist_gradient_boosting: {max_iter: 200, learning_rate: 0.08}

registry:
  dir: models
  # A candidate is promoted only if it beats the champion by at least
  # `min_improvement` on the validation window AND meets the latency budget.
  promotion_metric: roc_auc
  min_improvement: 0.01
  max_latency_ms_p95: 50
